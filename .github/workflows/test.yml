name: Test

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node scripts/gen-specgen-hash.js
      - run: make test
      - name: Guardrails — file-size cap (refactor.md §F)
        run: npm run loc:check
      - name: Guardrails — console-usage in monitored folders (refactor.md §F)
        run: npm run console:check
