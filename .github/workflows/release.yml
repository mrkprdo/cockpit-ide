name: Release Build

on:
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to build'
                required: true
                default: 'dev'

            changelog:
                description: 'Release changelog (markdown)'
                required: true

permissions:
    contents: write

jobs:
    build:
        runs-on: windows-latest

        steps:
            - name: Checkout selected branch
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.branch }}
                  clean: true

            - name: Setup Node 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Build installer
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: make package

            - name: Locate installer
              shell: pwsh
              run: |
                  $exe = Get-ChildItem -Path release -Filter *.exe -Recurse | Select-Object -First 1
                  if (-not $exe) { throw "No installer found" }

                  echo "INSTALLER_PATH=$($exe.FullName)" >> $env:GITHUB_ENV

            - name: Publish Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: release-${{ github.run_number }}
                  name: Release (${{ github.event.inputs.branch }})
                  body: ${{ github.event.inputs.changelog }}
                  prerelease: false
                  files: |
                      ${{ env.INSTALLER_PATH }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
