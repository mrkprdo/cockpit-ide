name: Release Build

on:
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to build'
                required: true
                default: 'dev'

permissions:
    contents: write

jobs:
    build:
        runs-on: windows-latest

        steps:
            - name: Checkout selected branch
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.branch }}
                  fetch-depth: 0
                  clean: true

            - name: Setup Node 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Generate specgen hash
              run: node scripts/gen-specgen-hash.js

            - name: Generate changelog
              shell: pwsh
              run: |
                  $releaseTag = git tag -l '*-release' --sort=-version:refname | Select-Object -First 1
                  if ([string]::IsNullOrEmpty($releaseTag)) {
                      $log = git log --oneline --no-decorate
                      $since = 'beginning'
                  } else {
                      $log = git log "$releaseTag..HEAD" --oneline --no-decorate
                      $since = $releaseTag
                  }
                  if (-not $log -or $log.Count -eq 0) { $log = @('No new commits since last release') }
                  $body = "## Changes since $since`n`n$($log -join "`n")"
                  $body | Out-File -FilePath "$env:RUNNER_TEMP\changelog.md" -Encoding utf8

            - name: Compute version
              shell: pwsh
              run: |
                  $date = Get-Date -Format 'yyyyMMdd'
                  $version = "0.0.$date"
                  echo "VERSION=$version" >> $env:GITHUB_ENV
                  echo "DATE=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_ENV

            - name: Build package
              run: make package

            - name: Locate installer
              shell: pwsh
              run: |
                  $exe = Get-ChildItem -Path out -Filter CockpitIDESetup-*.exe | Select-Object -First 1
                  if (-not $exe) { throw "No installer found in out/" }
                  echo "ARTIFACT_PATH=$($exe.FullName)" >> $env:GITHUB_ENV

            - name: Publish Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ env.VERSION }}-release
                  name: ${{ env.VERSION }}-release
                  body_path: ${{ runner.temp }}\changelog.md
                  prerelease: false
                  files: |
                      ${{ env.ARTIFACT_PATH }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
