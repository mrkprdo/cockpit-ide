name: Nightly Build (Dev)

on:
    schedule:
        - cron: '0 2 * * *'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: windows-latest

        steps:
            - name: Checkout dev (clean)
              uses: actions/checkout@v4
              with:
                  ref: dev
                  clean: true

            - name: Setup Node 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Generate changelog
              shell: pwsh
              run: |
                  $lastTag = git describe --tags --abbrev=0 2>$null
                  if (-not $lastTag) {
                      $log = git log --oneline --no-decorate -30
                  } else {
                      $log = git log "$lastTag..HEAD" --oneline --no-decorate
                  }
                  if (-not $log) { $log = "No new commits since last tag" }
                  $changelog = "## Changes since $($lastTag ?? 'beginning')`n`n$log"
                  echo "CHANGELOG<<EOF" >> $env:GITHUB_ENV
                  echo $changelog >> $env:GITHUB_ENV
                  echo "EOF" >> $env:GITHUB_ENV

            - name: Compute version
              shell: pwsh
              run: |
                  $date = Get-Date -Format 'yyyyMMdd'
                  $version = "0.0.$date"
                  echo "VERSION=$version" >> $env:GITHUB_ENV
                  echo "DATE=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_ENV

            - name: Build package
              run: make package

            - name: Locate installer
              shell: pwsh
              run: |
                  $exe = Get-ChildItem -Path out -Filter CockpitIDESetup-*.exe | Select-Object -First 1
                  if (-not $exe) { throw "No installer found in out/" }
                  echo "ARTIFACT_PATH=$($exe.FullName)" >> $env:GITHUB_ENV

            - name: Publish nightly release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: nightly
                  name: ${{ env.VERSION }}-nightly
                  body: ${{ env.CHANGELOG }}
                  prerelease: true
                  files: |
                      ${{ env.ARTIFACT_PATH }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
