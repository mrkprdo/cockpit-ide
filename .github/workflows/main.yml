name: Nightly Build (Dev)

on:
    schedule:
        - cron: '0 2 * * *'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: windows-latest

        steps:
            - name: Checkout dev (clean)
              uses: actions/checkout@v4
              with:
                  ref: dev
                  clean: true
                  fetch-depth: 0

            - name: Setup Node 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Generate specgen hash
              run: node scripts/gen-specgen-hash.js

            - name: Generate changelog
              shell: pwsh
              run: |
                  $since = "$((Get-Date).AddDays(-1).ToString('yyyy-MM-dd')) 23:56"; $until = "$(Get-Date -Format 'yyyy-MM-dd') 23:55"; $log = (git log --oneline --no-decorate --since="$since" --until="$until") -join "`n"; if (-not $log) { $log = "No commits in this window" }; $changelog = "### Commits from $since to $until`n`n$log"; echo "CHANGELOG<<EOF" >> $env:GITHUB_ENV; echo $changelog >> $env:GITHUB_ENV; echo "EOF" >> $env:GITHUB_ENV

            - name: Compute version
              shell: pwsh
              run: |
                  $date = Get-Date -Format 'yyyyMMdd'
                  $version = "0.0.$date"
                  echo "VERSION=$version" >> $env:GITHUB_ENV
                  echo "DATE=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_ENV

            - name: Build package
              run: make package

            - name: Locate installer
              shell: pwsh
              run: |
                  $exe = Get-ChildItem -Path out -Filter CockpitIDESetup-*.exe | Select-Object -First 1
                  if (-not $exe) { throw "No installer found in out/" }
                  echo "ARTIFACT_PATH=$($exe.FullName)" >> $env:GITHUB_ENV

            - name: Remove old nightly release (so fresh one is created)
              shell: pwsh
              run: |
                  gh release delete nightly -y 2>$null
                  git push origin :refs/tags/nightly 2>$null
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish nightly release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: nightly
                  name: ${{ env.VERSION }}-nightly
                  body: ${{ env.CHANGELOG }}
                  prerelease: true
                  files: |
                      ${{ env.ARTIFACT_PATH }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
